<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KI-Agenten, digitale Zwillinge, KI-Mitarbeiter · Tag 1</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141414">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Einstieg Tag 1 (Mi 11.11.2026, online). Passwort-Gate wie die Hauptseite /w/ki-agenten-2026-11/ (gleiches Passwort, gleicher Speicherschluessel).
       Nach dem Passwort geht es direkt auf kurs.html. Created: 2026-11-10 -->
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/inter-400.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/inter-600.woff2) format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 300 800; font-display: swap; src: url(/fonts/montserrat.woff2) format('woff2'); }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --gold: #d4a017; --gold-light: #e8b84a; --charcoal: #141414; --charcoal-light: #1a1a1a; --white: #f5f5f5; --white-muted: #b0b0b0;
            --font-heading: 'Montserrat', sans-serif; --font-body: 'Inter', sans-serif; }
    html, body { overflow-x: hidden; }
    body { font-family: var(--font-body); background: var(--charcoal); color: var(--white); line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { width: min(460px, 100%); text-align: center; padding: 34px 24px; background: var(--charcoal-light); border: 1px solid rgba(212,160,23,.18); border-radius: 14px; }
    .card img { height: 46px; width: auto; margin-bottom: 18px; }
    h1 { font-family: var(--font-heading); font-weight: 700; font-size: clamp(1.25rem, 4vw, 1.6rem); line-height: 1.3; margin-bottom: 6px; text-wrap: balance; }
    .sub { font-size: .88rem; color: var(--white-muted); margin-bottom: 18px; }
    .card p { font-size: .92rem; color: var(--white-muted); }
    form { display: flex; gap: .6rem; margin-top: 1.2rem; }
    input { flex: 1; min-width: 0; min-height: 48px; padding: 0 1rem; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: #101010; color: var(--white); font-size: 1rem; font-family: var(--font-body); }
    input:focus { outline: none; border-color: var(--gold); }
    button { min-height: 48px; padding: 0 1.3rem; border-radius: 10px; border: 2px solid var(--gold); background: var(--gold); color: #141414; font-weight: 700; font-size: .95rem; cursor: pointer; font-family: var(--font-body); }
    button:hover { background: var(--gold-light); border-color: var(--gold-light); }
    #err { color: #e8917a; font-size: .84rem; margin-top: .8rem; min-height: 1.2em; }
    footer { margin-top: 18px; font-size: .8rem; color: var(--white-muted); }
    footer a { color: var(--white-muted); }
  </style>
</head>
<body>
  <main class="card">
    <img src="jp-logo.png" alt="Jakub Popluhar">
    <img src="../akademie-logo.png" alt="Akademie für Künstliche Intelligenz und Digitalisierung" style="background:#fff;padding:6px 10px;border-radius:6px;box-sizing:border-box;width:auto;height:46px;margin-left:12px">
    <h1>KI-Agenten, digitale Zwillinge, KI-Mitarbeiter</h1>
    <p class="sub">KI-Teams aufbauen für bessere Prozesse · Tag 1 · Mittwoch, 11.11.2026 · 09:30 bis 17:00 · Online</p>
    <p>Das Passwort finden Sie in Ihrer E-Mail.</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="gate-input" placeholder="Passwort" aria-label="Passwort" autocomplete="off">
      <button type="submit">Öffnen</button>
    </form>
    <div id="err" role="alert"></div>
    <footer>Jakub Popluhar, M.Ed. · <a href="mailto:jakub@popluhar.at">jakub@popluhar.at</a></footer>
  </main>
  <script>
    (function () {
      var PASSWORD = 'kiteam', KEY = 'kiagenten2026-gate';
      try { if (localStorage.getItem(KEY) === PASSWORD) { location.replace('kurs.html' + location.hash); return; } } catch (e) {}
      var input = document.getElementById('gate-input');
      input.focus();
      document.getElementById('gate-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (input.value.trim().toLowerCase() === PASSWORD) {
          try { localStorage.setItem(KEY, PASSWORD); } catch (e) {}
          location.replace('kurs.html');
        } else {
          document.getElementById('err').textContent = 'Das Passwort stimmt nicht. Bitte prüfen Sie Ihre E-Mail.';
          input.value = ''; input.focus();
        }
      });
    })();
  </script>
  <script src="/assets/js/site.js" defer></script>
</body>
</html>

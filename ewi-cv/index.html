<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakub Popluhar &middot; Lebenslauf &amp; Trainingsangebot &middot; Institut EWI</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141414">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/png" href="../favicon.png">
  <style>
    @font-face { font-family: 'Great Vibes'; font-style: normal; font-weight: 400; font-display: swap; src: url(../fonts/great-vibes-400.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url(../fonts/inter-400.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url(../fonts/inter-500.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url(../fonts/inter-600.woff2) format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 300 800; font-display: swap; src: url(../fonts/montserrat.woff2) format('woff2'); }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #d4a017;
      --gold-light: #e8b84a;
      --gold-dark: #b8890f;
      --charcoal: #141414;
      --charcoal-light: #1a1a1a;
      --charcoal-lighter: #222222;
      --white: #f5f5f5;
      --white-muted: #b0b0b0;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html, body { min-height: 100%; overflow-x: hidden; }

    body {
      font-family: var(--font-body);
      background: var(--charcoal);
      color: var(--white);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--gold); text-decoration: none; }

    /* ========== HEADER ========== */
    .site-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(212, 160, 23, 0.12);
    }

    .logo { display: flex; align-items: center; text-decoration: none; }

    /* ========== GATE ========== */
    .gate-overlay {
      position: fixed;
      inset: 0;
      background: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .gate-card {
      width: 100%;
      max-width: 380px;
      background: var(--charcoal-light);
      border: 1px solid rgba(212, 160, 23, 0.25);
      border-radius: 12px;
      padding: 32px 28px;
      text-align: center;
    }

    .gate-card .badge {
      display: inline-block;
      font-family: var(--font-heading);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(212, 160, 23, 0.4);
      padding: 6px 14px;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    .gate-card h1 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .gate-card p.gate-sub {
      font-size: 0.9rem;
      color: var(--white-muted);
      margin-bottom: 22px;
    }

    .gate-input {
      width: 100%;
      background: var(--charcoal);
      border: 1px solid rgba(212, 160, 23, 0.3);
      border-radius: 8px;
      padding: 14px 16px;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 1rem;
      margin-bottom: 14px;
      min-height: 48px;
    }

    .gate-input:focus { outline: none; border-color: var(--gold); }

    .gate-button {
      width: 100%;
      background: var(--gold);
      color: var(--charcoal);
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 14px 20px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      min-height: 48px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .gate-button:hover { background: var(--gold-light); border-color: var(--gold-light); }

    .gate-error {
      color: #e8828a;
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 18px;
    }

    /* ========== MAIN ========== */
    main {
      display: none;
      flex: 1;
      padding: 44px 24px 56px;
      max-width: 880px;
      margin: 0 auto;
      width: 100%;
      flex-direction: column;
      gap: 44px;
    }

    main.unlocked { display: flex; }

    /* ========== TIME-BASED REVEAL MOTION ==========
       Content is fully visible with no transform/opacity dependency on JS,
       these are CSS-only autoplay animations (fill-mode both) that play once
       on load. If a browser doesn't support @keyframes, elements simply show
       at their end-state (opacity 1) immediately. No hide-until-JS-runs
       pattern, per the site's standing "visible on first paint" rule. */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reveal-el {
      animation: fadeInUp 0.75s cubic-bezier(.2,.7,.3,1) both;
    }

    .reveal-el.d1 { animation-delay: 0.08s; }
    .reveal-el.d2 { animation-delay: 0.16s; }
    .reveal-el.d3 { animation-delay: 0.24s; }
    .reveal-el.d4 { animation-delay: 0.32s; }

    @media (prefers-reduced-motion: reduce) {
      .reveal-el, .cred-track, .training-card, .cta-button { animation: none !important; transition: none !important; }
    }

    /* ========== HERO ========== */
    .hero { text-align: center; }

    .badge {
      display: inline-block;
      font-family: var(--font-heading);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(212, 160, 23, 0.4);
      padding: 6px 14px;
      border-radius: 4px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: -0.5px;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .hero .role {
      font-size: 1.05rem;
      color: var(--gold-light);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .hero p.bio {
      font-size: 1rem;
      color: var(--white-muted);
      max-width: 640px;
      margin: 0 auto;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto;
      opacity: 0.7;
    }

    /* ========== SECTION SHELL ========== */
    section.block { display: flex; flex-direction: column; gap: 18px; }

    .section-label {
      font-family: var(--font-heading);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
    }

    section.block h2.section-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.4rem;
    }

    /* ========== CV CARD ========== */
    .cv-card {
      background: var(--charcoal-light);
      border: 1px solid rgba(212, 160, 23, 0.15);
      border-radius: 10px;
      padding: 24px 26px;
      transition: border-color 0.25s, transform 0.25s;
    }

    .cv-card:hover { border-color: rgba(212, 160, 23, 0.32); }

    .cv-row {
      display: flex;
      gap: 18px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .cv-row:last-child { border-bottom: none; }

    .cv-when {
      flex: 0 0 120px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--white-muted);
      padding-top: 2px;
    }

    .cv-what { flex: 1; }

    .cv-what .t { font-weight: 700; font-size: 0.98rem; margin-bottom: 2px; }
    .cv-what .o { color: var(--gold-light); font-style: italic; font-size: 0.88rem; margin-bottom: 6px; }

    .cv-what ul { margin: 0; padding-left: 18px; }
    .cv-what li { font-size: 0.9rem; color: var(--white-muted); margin: 2px 0; }

    .cv-plain { font-size: 0.95rem; color: var(--white-muted); line-height: 1.7; }

    .cv-kv-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 18px;
    }

    .cv-kv-grid .kv-block .kv-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .cv-kv-grid .kv-block .kv-value { font-size: 0.92rem; color: var(--white-muted); line-height: 1.6; }

    /* ========== CREDIBILITY MARQUEE ========== */
    .cred-marquee {
      display: flex;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    }

    .cred-track {
      display: flex;
      align-items: center;
      gap: 14px;
      animation: cred-marquee-scroll 22s linear infinite;
      flex-shrink: 0;
      min-width: max-content;
      padding-right: 14px;
    }

    .cred-marquee:hover .cred-track { animation-play-state: paused; }

    @keyframes cred-marquee-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .cred-chip {
      background: var(--charcoal-light);
      border: 1px solid rgba(212, 160, 23, 0.25);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--white);
      white-space: nowrap;
      transition: border-color 0.25s, background 0.25s;
    }

    .cred-marquee:hover .cred-chip { border-color: rgba(212, 160, 23, 0.45); }

    .cred-logo-img {
      height: 34px;
      width: auto;
      flex-shrink: 0;
      opacity: 0.55;
      filter: grayscale(100%) brightness(2) contrast(0.5);
      transition: opacity 0.4s, filter 0.4s;
    }

    .cred-marquee:hover .cred-logo-img { opacity: 0.8; }

    .cred-item {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .cred-item .cred-logo-img { height: 30px; }

    .cred-name {
      font-family: var(--font-heading);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--white-muted);
    }

    .personal-photo-card { text-align: center; }

    .personal-photo {
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    }

    /* ========== VIDEO JUMP ========== */
    .video-jump { align-items: center; }

    .video-card { text-align: center; }

    .jump-video {
      width: 100%;
      max-width: 340px;
      border-radius: 14px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 160, 23, 0.15);
    }

    .jump-caption {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--gold-light);
      margin-top: 18px;
    }

    /* ========== TRAINING CARDS (tiles that move) ========== */
    .training-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .training-card {
      background: var(--charcoal-light);
      border: 1px solid rgba(212, 160, 23, 0.15);
      border-radius: 10px;
      padding: 22px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .training-card:hover {
      transform: translateY(-6px);
      border-color: rgba(212, 160, 23, 0.55);
      background: var(--charcoal-lighter);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(212, 160, 23, 0.08);
    }

    .training-card .t-label {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.02rem;
      line-height: 1.3;
      transition: color 0.25s ease;
    }

    .training-card:hover .t-label { color: var(--gold-light); }

    .training-card .t-tag {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .training-card .t-desc {
      font-size: 0.87rem;
      color: var(--white-muted);
      line-height: 1.6;
      flex: 1;
    }

    .training-card .t-note {
      font-size: 0.72rem;
      color: var(--white-muted);
      opacity: 0.7;
      font-style: italic;
    }

    /* ========== CTA ========== */
    .cta-section {
      background: var(--charcoal-light);
      border: 1px solid rgba(212, 160, 23, 0.3);
      border-radius: 12px;
      padding: 32px 28px;
      text-align: center;
    }

    .cta-section h2 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .cta-section p {
      font-size: 0.92rem;
      color: var(--white-muted);
      margin-bottom: 22px;
    }

    @keyframes ctaGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212, 160, 23, 0.35); }
      50% { box-shadow: 0 0 0 8px rgba(212, 160, 23, 0); }
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--gold);
      color: var(--charcoal);
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 15px 28px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      min-height: 48px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      animation: ctaGlow 2.6s ease-in-out infinite;
    }

    .cta-button:hover { background: var(--gold-light); border-color: var(--gold-light); transform: translateY(-2px); }
    .cta-button:active { transform: translateY(1px); }

    /* ========== FOOTER ========== */
    footer {
      padding: 20px 24px 28px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    footer p { font-size: 0.78rem; color: var(--white-muted); line-height: 1.8; }
    footer a { color: var(--white-muted); transition: color 0.2s; }
    footer a:hover { color: var(--gold); }

    /* ========== MOBILE ========== */
    @media (max-width: 700px) {
      .cv-kv-grid { grid-template-columns: 1fr; }
      .cv-row { flex-direction: column; gap: 4px; }
      .cv-when { flex: none; }
    }

    @media (max-width: 400px) {
      .logo { font-size: 1.55rem; }
      main { padding: 32px 16px 40px; gap: 32px; }
      .cv-card { padding: 18px 18px; }
      .cta-section { padding: 24px 18px; }
    }
  </style>
</head>

  </footer>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">

<title>Persönliche Lernseite · Jakub Popluhar</title>
<style>
  :root { --bg: #0a0a0a; --card: #141414; --ink: #f2f0eb; --muted: #a6a39a; --gold: #d4a017; --line: rgba(212,160,23,0.28); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(ellipse at 50% -10%, rgba(212,160,23,0.16), transparent 60%), var(--bg); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .gate { width: 100%; max-width: 400px; text-align: center; animation: rein .5s ease-out; }
  @keyframes rein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .foto { display: block; width: 128px; height: 128px; object-fit: cover; object-position: top; border-radius: 50%;
          border: 3px solid var(--gold); box-shadow: 0 0 0 8px rgba(212,160,23,0.08); margin: 0 auto -34px; position: relative; z-index: 1; background: #1a1a1a; }
  .karte { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 50px 22px 22px; }
  .marke { font-size: 0.66rem; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .gate h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.01em; }
  .gate p { color: var(--muted); font-size: 0.95rem; line-height: 1.55; margin-bottom: 20px; text-wrap: balance; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 13px 14px; border-radius: 11px; border: 1px solid var(--line); background: #0e0e0e;
          color: var(--ink); font-size: 1rem; outline: none; }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,160,23,0.18); }
  button { padding: 13px 18px; border-radius: 11px; border: 0; background: var(--gold); color: #0a0a0a; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  .err { color: #e8a07f; min-height: 1.4em; margin-top: 14px; font-size: 0.9rem; line-height: 1.45; text-wrap: balance; }
  .fuss { margin-top: 22px; font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .fuss img { height: 20px; width: auto; opacity: .9; }
</style>
</head>
<body>
<main class="gate" id="gate">
  <img class="foto" src="jakub-lachend.png" alt="Jakub Popluhar">
  <div class="karte">
    <div class="marke">Persönliche Lernseite</div>
    <h1>Schön, dass ihr da seid.</h1>
    <p>Alles aus unserer Stunde vom 18.11., nur für euch zwei. Das Passwort steht in meiner Mail.</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="gate-input" placeholder="Passwort" aria-label="Passwort" autocomplete="off">
      <button type="submit">Öffnen</button>
    </form>
    <div class="err" id="gate-err" role="alert"></div>
  </div>
  <div class="fuss"><img src="jp-logo.png" alt="">Jakub Popluhar · KI-Training</div>
</main>

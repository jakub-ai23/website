<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jakub Popluhar</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url(/fonts/inter-400.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:300 800;font-display:swap;src:url(/fonts/montserrat.woff2) format('woff2')}
:root{--gold:#d4a017;--gold-light:#e8b84a;--bg:#0a0a0a;--card:#141414;--ink:#f2f0eb;--muted:#9a978e;--border:rgba(212,160,23,.18)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:'Inter',Arial,sans-serif;line-height:1.6}
.card{max-width:460px;width:100%;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:40px 28px}
img{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--gold);margin-bottom:24px}
h1{font-family:'Montserrat',Arial,sans-serif;font-weight:700;font-size:1.4rem;margin-bottom:14px}
p{color:var(--muted);margin-bottom:28px}
a.btn{display:inline-block;background:var(--gold);color:#0a0a0a;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:6px}
a.btn:hover{background:var(--gold-light)}
.sig{margin-top:28px;font-size:.9rem;color:var(--muted)}
</style></head><body>
<main class="card">
<img src="/images/personal/jakub-suit-trainer.png" alt="Jakub Popluhar">
<h1>Diese Seite ist abgelaufen</h1>
<p>Die Informationen auf dieser Seite sind nicht mehr online. Wenn Sie sie weiterhin möchten, schreiben Sie mir eine kurze E-Mail, ich schicke sie Ihnen gern.</p>
<a class="btn" href="mailto:jakub@popluhar.at?subject=Profilseite%20rt%20austria">E-Mail schreiben</a>
<div class="sig">Jakub Popluhar · jakub@popluhar.at</div>
</main></body></html>
